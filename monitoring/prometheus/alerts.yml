groups:
  - name: churn-model
    rules:
      - alert: ChurnModelRetrainNeeded
        expr: model_retrain_needed == 1
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "El monitor decidió REENTRENAR el modelo de churn"

      # Reto 3: data drift crítico sostenido en alguna feature
      - alert: ChurnModelPsiCritical
        expr: model_psi_max > 0.25
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "PSI máximo {{ $value }} > 0.25 durante 1 minuto (data drift crítico)"
